<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Portfolio Wii</title>
    <style>
        /* --- CONFIGURATION GLOBALE --- */
        :root {
            --bg-color: #e0e0e0;
            --wii-blue: #60a0dc;
            --wii-gray: #b0b0b0;
            --glass-shine: rgba(255, 255, 255, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* Motif de fond subtil quadrillé */
            background-image: 
                linear-gradient(rgba(200,200,200, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(200,200,200, 0.3) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* --- GRILLE DES CHAÎNES --- */
        .wii-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
            width: 800px;
            height: 500px;
            padding: 20px;
        }

        /* --- STYLE D'UNE CHAÎNE (CHANNEL) --- */
        .channel {
            background: white;
            border-radius: 20px;
            border: 4px solid #dcdcdc;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Effet de brillance (Glassy effect) */
        .channel::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 45%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.1) 100%);
            border-radius: 15px 15px 100% 100% / 15px 15px 20px 20px;
            pointer-events: none;
        }

        /* Hover style (Le contour bleu typique) */
        .channel:hover {
            border-color: var(--wii-blue);
            box-shadow: 0 0 15px var(--wii-blue);
            transform: scale(1.02);
        }

        /* Contenu de la chaîne Test */
        .channel-content {
            z-index: 1;
            text-align: center;
            color: #555;
        }
        
        .channel-icon {
            font-size: 3rem;
            margin-bottom: 5px;
            display: block;
        }

        .channel-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: #888;
        }

        /* Chaînes vides (bruit statique simulé) */
        .channel.empty {
            cursor: default;
            background: #f0f0f0;
        }
        .channel.empty:hover {
            border-color: #dcdcdc;
            box-shadow: none;
            transform: none;
        }

        /* --- L'ANIMATION DE ZOOM (L'OVERLAY) --- */
        .channel-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }

        .channel-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* L'écran "Démarrer" */
        .start-screen {
            width: 700px;
            height: 400px;
            background: linear-gradient(135deg, #ffffff 0%, #e6e6e6 100%);
            border-radius: 20px; /* Moins arrondi que la grille */
            border: 4px solid #ccc;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            transform: scale(0.1);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Effet de rebond */
            overflow: hidden;
            position: relative;
        }

        .channel-overlay.active .start-screen {
            transform: scale(1);
        }

        /* Contenu de l'écran Démarrer */
        .banner-area {
            flex: 2;
            background: #f0f0f0; /* Place pour une image */
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #ccc;
            position: relative;
            overflow: hidden;
        }
        
        /* Animation de fond style Wii */
        .banner-bg {
            position: absolute;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(200, 200, 200, 0.1) 10px,
                rgba(200, 200, 200, 0.1) 20px
            );
            animation: scrollBg 20s linear infinite;
        }

        @keyframes scrollBg {
            0% { transform: translate(0,0); }
            100% { transform: translate(-50px, -50px); }
        }

        .banner-title {
            font-size: 3rem;
            color: #555;
            z-index: 2;
        }

        .controls-area {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            background: white;
        }

        /* Boutons Wii */
        .wii-btn {
            padding: 15px 40px;
            border-radius: 30px;
            border: 2px solid #ccc;
            background: white;
            font-size: 1.2rem;
            color: #555;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        /* Effet gloss sur les boutons */
        .wii-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(255,255,255,0.1));
        }

        .wii-btn:hover {
            border-color: var(--wii-blue);
            color: var(--wii-blue);
            box-shadow: 0 0 10px var(--wii-blue);
            transform: scale(1.05);
        }

        /* Bas de page (footer style Wii) */
        .footer-bar {
            position: absolute;
            bottom: 20px;
            width: 800px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        .footer-pill {
            background: white;
            border: 2px solid #ccc;
            padding: 10px 30px;
            border-radius: 50px;
            color: #888;
            font-weight: bold;
            box-shadow: 1px 1px 5px rgba(0,0,0,0.1);
        }

    </style>
</head>
<body>

    <div class="wii-grid">
        <div class="channel" onclick="openChannel('Portfolio', '🧪')">
            <div class="channel-content">
                <span class="channel-icon">🧪</span>
                <div class="channel-title">Projet Test</div>
            </div>
        </div>

        <div class="channel empty"></div>
        <div class="channel empty"></div>
        <div class="channel empty"></div>
        <div class="channel empty"></div>
        <div class="channel empty"></div>
        <div class="channel empty"></div>
        <div class="channel empty"></div>
        <div class="channel empty"></div>
        <div class="channel empty"></div>
        <div class="channel empty"></div>
        <div class="channel empty"></div>
    </div>

    <div class="footer-bar">
        <div class="footer-pill">Wii Menu</div>
        <div class="footer-pill" id="clock">12:00</div>
    </div>

    <div id="overlay" class="channel-overlay">
        <div class="start-screen">
            <div class="banner-area">
                <div class="banner-bg"></div>
                <h1 id="overlay-title" class="banner-title">Titre</h1>
            </div>
            <div class="controls-area">
                <button class="wii-btn" onclick="closeChannel()">Menu Wii</button>
                <button class="wii-btn" onclick="goToProject()">Démarrer</button>
            </div>
        </div>
    </div>

    <script>
        // --- LOGIQUE JAVASCRIPT ---

        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        let currentLink = "#"; // Lien par défaut

        // Fonction pour l'horloge en bas
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 1. Ouvrir le "Start Screen"
        function openChannel(title, icon) {
            // Mise à jour du contenu
            overlayTitle.innerHTML = icon + " " + title;
            
            // Affichage avec animation
            overlay.classList.add('active');
        }

        // 2. Fermer le "Start Screen"
        function closeChannel() {
            overlay.classList.remove('active');
        }

        // 3. Action du bouton Démarrer
        function goToProject() {
            alert("Lancement du projet... (Ici tu mettras ton lien vers le projet)");
            // window.location.href = 'ton-lien-projet.html';
        }

        // Fermer l'overlay si on clique en dehors de la boîte
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                closeChannel();
            }
        });

    </script>
</body>
</html>
