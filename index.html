<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wii Portfolio</title>
    <style>
        /* Configuration générale du corps et du fond */
        body, html {
            height: 100%;
            margin: 0;
            font-family: sans-serif;
            background-color: #e8e8e8;
            background-image: repeating-linear-gradient(
                0deg, transparent, transparent 2px, #d4d4d4 2px, #d4d4d4 4px
            );
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            user-select: none;
            overflow: hidden;
        }

        /* Grille des chaînes (rectangles) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2vh;
            width: 90vw;
            max-width: 1200px;
            height: 60vh;
            margin-bottom: 5vh;
        }

        /* Style d'un rectangle vide avec le motif rayé et le logo Wii */
        .channel {
            background-color: #d4d4d4;
            border: 4px solid #b0b0b0;
            border-radius: 20px;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.1);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="50" viewBox="0 0 100 50"><text x="50" y="35" font-family="sans-serif" font-size="30" fill="%23c0c0c0" text-anchor="middle">Wii</text></svg>'),
                              repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.1) 2px, rgba(255,255,255,0.1) 4px);
            background-repeat: no-repeat, repeat;
            background-position: center, center;
            background-size: contain, auto;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        /* Style pour le rectangle sélectionné (blanc uni) */
        .channel.selected {
            background-color: #ffffff;
            background-image: none;
            border-color: #ffffff;
        }

        /* Barre inférieure incurvée */
        .footer {
            width: 100%;
            height: 25vh;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5vw;
            background: linear-gradient(to top, #dcdcdc 0%, #eeeeee 100%);
            border-top: 2px solid #bbb;
            mask-image: radial-gradient(circle at 50% -50px, transparent 220px, black 221px);
            -webkit-mask-image: radial-gradient(circle at 50% -50px, transparent 220px, black 221px);
        }

        /* Icônes détaillées des boutons inférieurs (Wii et Enveloppe) */
        .footer-icon {
            width: 10vh;
            height: 10vh;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, #dcdcdc);
            border: 3px solid #b0b0b0;
            box-shadow: 2px 5px 10px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4vh;
            color: #888;
            font-weight: bold;
        }
        .footer-icon.wii {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="%23b0b0b0" stroke-width="3"/><text x="50" y="60" font-family="sans-serif" font-size="30" fill="%23888" text-anchor="middle">Wii</text></svg>');
            background-size: cover;
            background-color: #e8e8e8;
            border: none;
            box-shadow: none;
        }
        .footer-icon.mail {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="%23b0b0b0" stroke-width="3"/><text x="50" y="65" font-family="sans-serif" font-size="50" fill="%23888" text-anchor="middle">✉️</text></svg>');
            background-size: cover;
            background-color: #e8e8e8;
            border: none;
            box-shadow: none;
        }

        /* Zone de l'heure et de la date */
        .time-date-container {
            text-align: center;
            color: #666;
            font-family: sans-serif;
            z-index: 2;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 6vh;
        }
        .time {
            font-size: 5vh;
            font-weight: 300;
            letter-spacing: -2px;
            display: flex;
            align-items: baseline;
            justify-content: center;
        }
        .ampm { font-size: 2.5vh; margin-left: 5px; font-weight: bold; }
        .date { font-size: 2.5vh; color: #888; margin-top: 0vh; }
        .blue-line {
            position: absolute;
            bottom: -1vh;
            left: 50%;
            transform: translateX(-50%);
            width: 30vw;
            height: 10vh;
            border-bottom: 4px solid #4ac0e0;
            border-radius: 50%;
            z-index: -1;
            opacity: 0.6;
        }

        /* Curseur Wii (main) */
        body {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="white" stroke="black" stroke-width="1.5"><path d="M10 2L9 9H5C3.34 9 2 10.34 2 12V22H18V13L15.5 6L14.5 4L13 2H10Z"/></svg>') 10 2, auto;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="channel selected"></div>
        <div class="channel"></div>
        <div class="channel"></div>
        <div class="channel"></div>
        <div class="channel"></div>
        <div class="channel"></div>
        <div class="channel"></div>
        <div class="channel"></div>
        <div class="channel"></div>
        <div class="channel"></div>
        <div class="channel"></div>
        <div class="channel"></div>
    </div>

    <div class="footer">
        <div class="footer-icon wii"></div>
        <div class="time-date-container">
            <div class="time">
                <span>12</span>:<span>14</span>
                <span class="ampm">AM</span>
            </div>
            <div class="date">Wed 12/24</div>
            <div class="blue-line"></div>
        </div>
        <div class="footer-icon mail"></div>
    </div>
</body>
</html>
