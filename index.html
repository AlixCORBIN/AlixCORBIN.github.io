<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wii Portfolio - Footer Réaliste</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

    <style>
        /* --- CONFIGURATION GLOBALE --- */
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background-color: #e8e8e8;
            /* Le fond strié original */
            background-image: repeating-linear-gradient(
                0deg, transparent, transparent 2px, #d4d4d4 2px, #d4d4d4 4px
            );
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- GRILLE (Pour l'exemple) --- */
        .grid-container {
            flex: 1; /* Prend toute la place dispo */
            width: 90vw;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
            margin-top: 5vh;
            margin-bottom: 2vh;
        }
        
        .channel {
            background: white;
            border-radius: 20px;
            border: 4px solid #cecece;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.05);
        }

        /* --- LE FOOTER REALISTE --- */
        .footer-container {
            position: relative;
            width: 100%;
            height: 140px; /* Hauteur fixe pour le footer */
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 10;
        }

        /* 1. L'IMAGE DE FOND (DESSINÉE EN CSS/SVG) */
        .footer-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        /* Ombre portée sous la barre bleue */
        .footer-bg svg {
            filter: drop-shadow(0px -2px 4px rgba(0,0,0,0.15));
        }

        /* 2. LES BOUTONS RONDS (Wii & Mail) */
        .wii-btn-wrapper {
            position: absolute;
            bottom: 25px; /* Ajustement vertical */
            z-index: 2;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            /* Effet d'enfoncement dans le footer */
            background: linear-gradient(to bottom, #d0d0d0, #f0f0f0);
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .left-btn { left: 40px; }
        .right-btn { right: 40px; }

        /* La "Bulle" brillante du bouton */
        .glass-btn {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #dcdcdc 60%, #a0a0a0 100%);
            border: 2px solid #b0b0b0;
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Effet de reflet "glossy" sur le dessus du bouton */
        .glass-btn::after {
            content: '';
            position: absolute;
            top: 5px; left: 15px;
            width: 45px; height: 30px;
            border-radius: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.9), rgba(255,255,255,0.1));
            pointer-events: none;
        }

        .glass-btn:hover { transform: scale(1.05); border-color: #4ac0e0; }
        .glass-btn:active { transform: scale(0.95); }

        /* Icônes dans les boutons */
        .btn-text {
            color: #999;
            font-size: 24px;
            font-weight: bold;
            z-index: 2;
            text-shadow: 1px 1px 0 #fff;
        }
        .btn-icon {
            width: 50%;
            opacity: 0.6;
            z-index: 2;
        }

        /* 3. L'HORLOGE DIGITALE */
        .clock-area {
            text-align: center;
            margin-bottom: 20px; /* Remonte le texte */
            z-index: 5;
            color: #6a6a6a;
        }

        .digital-time {
            font-family: 'Orbitron', monospace; /* Police style digital */
            font-size: 4rem;
            color: #888;
            letter-spacing: 2px;
            display: flex;
            align-items: baseline;
            justify-content: center;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
        }
        
        .ampm { font-size: 1.5rem; margin-left: 10px; font-weight: bold; font-family: sans-serif; }
        .date-text { font-size: 1.6rem; color: #777; margin-top: -5px; font-weight: 500;}

        /* Responsive : sur mobile on réduit un peu */
        @media (max-width: 600px) {
            .footer-container { height: 100px; }
            .wii-btn-wrapper { width: 60px; height: 60px; bottom: 15px; }
            .left-btn { left: 10px; } .right-btn { right: 10px; }
            .glass-btn { width: 50px; height: 50px; }
            .digital-time { font-size: 2.5rem; }
            .btn-text { font-size: 14px; }
        }

    </style>
</head>
<body>

    <div class="grid-container">
        <div class="channel"></div><div class="channel"></div><div class="channel"></div><div class="channel"></div>
        <div class="channel"></div><div class="channel"></div><div class="channel"></div><div class="channel"></div>
        <div class="channel"></div><div class="channel"></div><div class="channel"></div><div class="channel"></div>
    </div>

    <div class="footer-container">
        
        <div class="footer-bg">
            <svg width="100%" height="100%" viewBox="0 0 1000 140" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="greyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#dcdcdc;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <path d="M0,140 L0,0 Q250,0 350,35 T650,35 T1000,0 L1000,140 Z" fill="url(#greyGrad)" stroke="#4ac0e0" stroke-width="4"/>
            </svg>
        </div>

        <div class="wii-btn-wrapper left-btn">
            <div class="glass-btn">
                <span class="btn-text" style="font-family: sans-serif; letter-spacing: -1px;">Wii</span>
            </div>
        </div>

        <div class="clock-area">
            <div class="digital-time">
                <span id="h">12</span><span style="animation: blink 1s infinite">:</span><span id="m">19</span>
                <span class="ampm">AM</span>
            </div>
            <div class="date-text" id="date">Wed 12/24</div>
        </div>

        <div class="wii-btn-wrapper right-btn">
            <div class="glass-btn">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="#999">
                    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
            </div>
        </div>

    </div>

    <script>
        // Script pour l'heure réelle
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;

            document.getElementById('h').innerText = hours;
            document.getElementById('m').innerText = minutes;

            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const dayStr = days[now.getDay()];
            const month = now.getMonth() + 1;
            const dateNum = now.getDate();
            document.getElementById('date').innerText = `${dayStr} ${month}/${dateNum}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
