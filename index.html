<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Wii</title>
<style>
  body, html {
    height: 100%;
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #e0e0e0; /* Fond gris clair */
    display: flex;
    flex-direction: column;
  }

  /* Conteneur principal pour centrer le contenu */
  .main-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  /* Grille des chaînes */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr); /* 4 colonnes */
    grid-template-rows: repeat(3, 1fr); /* 3 rangées */
    gap: 15px;
    width: 80%; /* Largeur relative */
    max-width: 800px; /* Largeur maximale pour ne pas être trop grand */
    aspect-ratio: 4 / 3; /* Ratio d'aspect pour ressembler à l'écran Wii */
  }

  /* Style d'une chaîne individuelle */
  .channel {
    background-color: #d0d0d0; /* Gris plus foncé pour les chaînes inactives */
    border: 3px solid #c0c0c0; /* Bordure grise */
    border-radius: 20px; /* Coins arrondis */
    box-shadow: inset 0 0 10px rgba(0,0,0,0.1); /* Ombre intérieure subtile */
    cursor: pointer;
    transition: all 0.2s ease-in-out;
  }

  /* Effet de survol (hover) */
  .channel:hover {
    background-color: #e8e8e8; /* Plus clair au survol */
    border-color: #50c0e0; /* Bordure bleue cyan */
    box-shadow: 0 0 15px #50c0e0; /* Lueur bleue */
    transform: scale(1.05); /* Léger agrandissement */
  }

  /* Style pour la première chaîne, sélectionnée par défaut dans l'image */
  .channel.selected {
    background-color: #e8e8e8;
  }

  /* Barre du bas */
  .footer-bar {
    height: 120px;
    background-color: #fff;
    border-top: 4px solid #50c0e0; /* Bordure supérieure bleue */
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 40px;
    position: relative;
  }

  /* Forme incurvée de la barre du bas */
  .footer-bar::before {
    content: '';
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 40px;
    background-color: #fff;
    border-top: 4px solid #50c0e0;
    border-radius: 50% 50% 0 0; /* Forme de demi-cercle */
  }

  /* Boutons ronds (Wii et Enveloppe) */
  .circle-button {
    width: 70px;
    height: 70px;
    background-color: #e8e8e8;
    border: 3px solid #c0c0c0;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 18px;
    color: #808080;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    z-index: 1; /* Pour être au-dessus de la forme incurvée */
  }

  /* Icône d'enveloppe (simplifiée) */
  .envelope-icon {
    font-size: 30px;
  }

  /* Section Heure et Date au centre */
  .time-date {
    text-align: center;
    color: #808080;
    z-index: 1;
  }

  /* Style de l'heure */
  .time {
    font-size: 48px;
    font-weight: bold;
    display: flex;
    align-items: baseline;
    justify-content: center;
  }

  /* Style AM/PM */
  .am-pm {
    font-size: 24px;
    margin-left: 5px;
  }

  /* Style de la date */
  .date {
    font-size: 20px;
    margin-top: 5px;
  }

</style>
</head>
<body>

  <div class="main-container">
    <div class="grid-container">
      <div class="channel selected"></div>
      <div class="channel"></div>
      <div class="channel"></div>
      <div class="channel"></div>
      <div class="channel"></div>
      <div class="channel"></div>
      <div class="channel"></div>
      <div class="channel"></div>
      <div class="channel"></div>
      <div class="channel"></div>
      <div class="channel"></div>
      <div class="channel"></div>
    </div>
  </div>

  <div class="footer-bar">
    <div class="circle-button">Wii</div>
    <div class="time-date">
      <div class="time">
        <span id="hours">10</span><span id="minutes">00</span>
        <span class="am-pm" id="ampm">AM</span>
      </div>
      <div class="date" id="date">Mon 1/01</div>
    </div>
    <div class="circle-button">
      <span class="envelope-icon">✉️</span>
    </div>
  </div>

<script>
  // Script pour mettre à jour l'heure et la date
  function updateTimeAndDate() {
    const now = new Date();
    
    // Heure
    let hours = now.getHours();
    const minutes = now.getMinutes().toString().padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12; // L'heure '0' doit être '12'
    
    document.getElementById('hours').textContent = hours;
    document.getElementById('minutes').textContent = ':' + minutes;
    document.getElementById('ampm').textContent = ampm;

    // Date
    const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const dayName = days[now.getDay()];
    const month = now.getMonth() + 1; // Les mois commencent à 0
    const day = now.getDate();
    
    document.getElementById('date').textContent = `${dayName} ${month}/${day}`;
  }

  // Mettre à jour immédiatement puis toutes les secondes
  updateTimeAndDate();
  setInterval(updateTimeAndDate, 1000);
</script>

</body>
</html>
