            <h1 class="brand"><span class="brand-dot"></span>Mii</h1>

    <!-- ================= ÉDITEUR ================= -->
    <section id="editor" class="view" aria-label="Éditeur">
        <div class="ed-stage" id="ed-stage">
            <div class="ed-stage-tools">
                <button class="round" id="btn-undo" title="Annuler (Ctrl+Z)" aria-label="Annuler">↶</button>
                <button class="round" id="btn-redo" title="Rétablir (Ctrl+Y)" aria-label="Rétablir">↷</button>
                <button class="round" id="btn-zoom" title="Zoom" aria-label="Zoom"><span class="ic"><svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 3a7 7 0 0 1 5.573 11.232l4.078 3.548c1.28 1.114.492 3.22-1.205 3.22a1.84 1.84 0 0 1-1.43-.685l-3.453-4.29A7 7 0 1 1 10 3m0 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8" fill="currentColor"/></svg></span></button>
                <button class="round" id="btn-spin" title="Tourner" aria-label="Tourner">⟳</button>
            </div>
            <div class="ed-name" id="ed-name"></div>
        </div>

        <div class="ed-panel">
            <div class="tabs" id="tabs" role="tablist"></div>
            <div class="tab-body" id="tab-body"></div>
            <div class="ed-actions">
                <button class="pill pill--ghost" id="btn-quit" data-i18n="cancel">Annuler</button>
                <button class="pill" id="btn-random" data-i18n="randomize">Au hasard</button>
                <button class="pill pill--primary" id="btn-save" data-i18n="save">Enregistrer</button>
            </div>
        </div>
    </section>

    <!-- ================= MODALES ================= -->
    <div class="modal" id="modal" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" id="modal-card"></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
